<!-- ═══ Career Chat Widget (AI career advisor) ═══ -->
<div id="career-chat" class="career-chat" data-career-chat data-authenticated="{% if is_authenticated %}true{% else %}false{% endif %}">
  <!-- Toggle Button -->
  <button id="career-chat-toggle" class="career-chat-toggle" aria-label="Open career assistant" title="Ask about your career">
    <svg class="career-chat-toggle__icon" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
    </svg>
  </button>

  <!-- Chat Panel -->
  <div id="career-chat-panel" class="career-chat-panel" role="dialog" aria-label="Career assistant chat">
    <!-- Header -->
    <div class="career-chat__header">
      <div class="career-chat__header-left">
        <div class="career-chat__avatar-wrap">
          <div class="career-chat__avatar" aria-hidden="true">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 2a4 4 0 0 1 4 4c0 1.95-1.4 3.58-3.25 3.93"/>
              <path d="M8.56 9.8A4 4 0 1 1 15.43 12"/>
              <path d="M12 18v4"/>
              <path d="M8 22h8"/>
            </svg>
          </div>
          <span class="career-chat__status-dot" aria-hidden="true"></span>
        </div>
        <div class="career-chat__header-info">
          <span class="career-chat__header-name">Prayash AI</span>
          <span class="career-chat__header-status">
            <span data-chat-status-text>Ready to help</span>
          </span>
        </div>
      </div>
      <div class="career-chat__header-actions">
        <button class="career-chat__header-btn" data-chat-minimize aria-label="Minimize chat" title="Minimize">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 15l-6-6-6 6"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- Messages -->
    <div id="career-chat-messages" class="career-chat__messages" role="log" aria-live="polite">
      <div class="chat-message is-assistant">
        <div class="chat-message__avatar" aria-hidden="true">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2a4 4 0 0 1 4 4c0 1.95-1.4 3.58-3.25 3.93"/>
            <path d="M8.56 9.8A4 4 0 1 1 15.43 12"/>
            <path d="M12 18v4"/>
            <path d="M8 22h8"/>
          </svg>
        </div>
        <div class="chat-message__bubble">
          <div class="chat-welcome">
            <div class="chat-welcome__greeting">Hi there! 👋</div>
            <p class="chat-welcome__text">I'm your AI Career Advisor. I can help you with career planning, skill development, resume tips, and interview prep.</p>
            <p class="chat-welcome__text">What would you like to explore?</p>
          </div>
          <div class="chat-quick-actions">
            <button class="chat-quick-action" data-chat-quick="What skills should I learn?">
              <span class="chat-quick-action__icon">💡</span>
              <span class="chat-quick-action__text">Skills</span>
            </button>
            <button class="chat-quick-action" data-chat-quick="How can I improve my resume?">
              <span class="chat-quick-action__icon">📄</span>
              <span class="chat-quick-action__text">Resume</span>
            </button>
            <button class="chat-quick-action" data-chat-quick="Tips for job interviews?">
              <span class="chat-quick-action__icon">🎯</span>
              <span class="chat-quick-action__text">Interviews</span>
            </button>
            <button class="chat-quick-action" data-chat-quick="Help me plan my career path">
              <span class="chat-quick-action__icon">🗺️</span>
              <span class="chat-quick-action__text">Career</span>
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Attached file context (hidden until a file is loaded) -->
    <div class="career-chat__context" id="career-chat-context" hidden>
      <span class="career-chat__context-icon" aria-hidden="true">📎</span>
      <div class="career-chat__context-info">
        <span class="career-chat__context-name" data-chat-context-name>document</span>
        <span class="career-chat__context-meta" data-chat-context-meta></span>
      </div>
      <button class="career-chat__context-remove" data-chat-context-remove aria-label="Remove attached file" title="Remove file">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"/>
          <line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>

    <!-- Upload progress (visible while a file is uploading) -->
    <div class="career-chat__progress" id="career-chat-progress" hidden aria-hidden="true">
      <div class="career-chat__progress-bar" id="career-chat-progress-bar"></div>
    </div>

    <!-- Input -->
    <div class="career-chat__input-area">
      <input
        type="file"
        id="career-chat-file"
        class="career-chat__file-input"
        accept=".pdf,.docx,.txt,.md,.csv,.rtf,.xlsx,.png,.jpg,.jpeg"
        aria-label="Attach a document or image (PDF, DOCX, XLSX, PNG, JPG)"
      >
      <button id="career-chat-attach" class="career-chat__attach" aria-label="Attach a file for guidance" title="Attach a document or image">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21.44 11.05l-9.19 9.19a6 6 0 01-8.49-8.49l9.19-9.19a4 4 0 015.66 5.66l-9.2 9.19a2 2 0 01-2.83-2.83l8.49-8.48"/>
        </svg>
      </button>
      <div class="career-chat__input-wrap">
        <input
          id="career-chat-input"
          class="career-chat__input"
          type="text"
          placeholder="Ask about your career..."
          autocomplete="off"
          aria-label="Type your career question"
        >
      </div>
      <button id="career-chat-send" class="career-chat__send" aria-label="Send message" title="Send">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/>
        </svg>
      </button>
    </div>
    <p class="career-chat__hint">Prayash can make mistakes — verify important career advice.</p>
  </div>
</div>

<script src="{{ url_for('static', filename='career-chat.js', v=static_version) }}"></script>
