{% extends "base.html" %}

{% block content %}
<section class="page-section page-hero">
  <div class="container page-hero__grid">
    <div>
      <span class="eyebrow">Account</span>
      <h1>Create a Prayash account.</h1>
      <p class="lead">Sign up to unlock session persistence and protected workspace access for your capstone review flow.</p>
    </div>
    <div class="glass-card">
      <h2 class="section-title">Sign Up</h2>
      {% if error %}
      <p class="small-note" style="color: var(--error);">{{ error }}</p>
      {% endif %}
      <form method="post" class="results-shell" style="margin-top: 1rem;">
        <div class="field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="email" required>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="new-password" required>
        </div>
        <div class="field">
          <label for="confirm_password">Confirm password</label>
          <input id="confirm_password" name="confirm_password" type="password" autocomplete="new-password" required>
        </div>
        <button class="button-secondary" type="submit">Create account</button>
      </form>
      <p class="section-subtitle" style="margin-top: 1rem;">Already registered? <a href="{{ url_for('login') }}" style="text-decoration: underline;">Log in</a>.</p>
    </div>
  </div>
</section>
{% endblock %}
