{% extends "base.html" %}

{% block content %}
<section class="page-section page-hero">
  <div class="container page-hero__grid">
    <div>
      <span class="eyebrow">Account</span>
      <h1>Log in to access your Prayash workspace.</h1>
      <p class="lead">Authentication enables workspace access, upload tracking metadata, and role-based admin visibility.</p>
    </div>
    <div class="glass-card">
      <h2 class="section-title">Login</h2>
      {% if error %}
      <p class="small-note" style="color: var(--error);">{{ error }}</p>
      {% endif %}
      <form method="post" class="results-shell" style="margin-top: 1rem;">
        <input type="hidden" name="next" value="{{ next_url }}">
        <div class="field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="email" required>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required>
        </div>
        <button class="button-secondary" type="submit">Login</button>
      </form>
      <p class="section-subtitle" style="margin-top: 1rem;">Need an account? <a href="{{ url_for('signup') }}" style="text-decoration: underline;">Sign up here</a>.</p>
    </div>
  </div>
</section>
{% endblock %}
