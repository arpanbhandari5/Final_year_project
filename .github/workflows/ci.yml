name: CI

on:
  push:
    branches: [main, final-year-project]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Cache ML models
        uses: actions/cache@v4
        with:
          path: ml_models/
          key: ml-models-${{ hashFiles('train_model.py', 'data/*.csv') }}

      - name: Train ML model (if cache miss)
        run: python train_model.py

      - name: Run unit tests
        run: python -m pytest tests/ -v --tb=short
        env:
          # Disable SMTP so tests never try to send real emails
          MAIL_USERNAME: ""
          MAIL_PASSWORD: ""
          SMTP_USERNAME: ""
          SMTP_PASSWORD: ""
          # Use a disposable temp database
          DATABASE_URL: "sqlite:///test_ci.db"
          FLASK_SECRET_KEY: "ci-test-secret-key-do-not-use-in-production"