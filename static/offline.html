<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline — Prayash</title>
  <meta name="theme-color" content="#7c3aed">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Inter, -apple-system, sans-serif;
      background: #f9f9ff;
      color: #111c2d;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 2rem;
    }
    .offline-card {
      text-align: center;
      max-width: 420px;
      padding: 3rem 2rem;
      background: white;
      border-radius: 1rem;
      border: 1px solid #ccc3d4;
      box-shadow: 0 10px 15px -3px rgba(30, 41, 59, 0.05);
    }
    .offline-icon { font-size: 4rem; margin-bottom: 1rem; }
    h1 { font-size: 1.5rem; color: #4c1d95; margin-bottom: 0.5rem; }
    p { color: #4a4452; line-height: 1.6; margin-bottom: 1.5rem; }
    .retry-btn {
      display: inline-block;
      padding: 0.8rem 1.8rem;
      background: #4c1d95;
      color: white;
      border: none;
      border-radius: 0.75rem;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      transition: background 160ms ease;
    }
    .retry-btn:hover { background: #6d28d9; }
  </style>
</head>
<body>
  <div class="offline-card">
    <div class="offline-icon">📡</div>
    <h1>You're offline</h1>
    <p>Prayash needs an internet connection to analyze resumes. Please check your connection and try again.</p>
    <button class="retry-btn" onclick="window.location.reload()">Retry</button>
  </div>
</body>
</html>
